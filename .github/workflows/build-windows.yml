name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller TheMClipping.spec --noconfirm
      - run: python build_tools/prepare_bundle.py dist/TheMClipping
      - run: Compress-Archive -Path dist/TheMClipping -DestinationPath TheMClipping-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: TheMClipping-windows, path: TheMClipping-windows.zip }
